<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="sf-hero-t sf-hero-d">
<title id="sf-hero-t">From idea to shipped</title>
<desc id="sf-hero-d">A friendly robot agent works at a bench. An idea, shown as a light bulb, rides a belt through three arches, each topped with a green check: it becomes a plan sheet, then a built block, then a packed box, and leaves at the end as a taped, shipped box with its own green check.</desc>
<style>
:root { color-scheme: light dark; }
.bd { fill: #F3F5F6; }
.pp { fill: #FFFFFF; stroke: #C9D1D6; stroke-width: 2; }
.pf { fill: #FFFFFF; }
.pl { fill: none; stroke: #C9D1D6; stroke-width: 3.5; stroke-linecap: round; }
.dk { fill: #CDD5DA; }
.dk2 { fill: #E1E7EA; }
.gr { fill: #3A454B; }
.grs { fill: none; stroke: #3A454B; stroke-linecap: round; stroke-linejoin: round; }
.scr { fill: #121719; }
.eye { fill: #E8EDEF; }
.mu { fill: #77838A; }
.mus { fill: none; stroke: #77838A; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.ok { fill: #0B6A4C; }
.oks { fill: #E2F1EA; }
.okl { fill: none; stroke: #0B6A4C; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.ck { fill: none; stroke: #FFFFFF; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
.no { fill: #B42318; }
.nos { fill: #FBE4E1; }
.wn { fill: #E3A83A; }
.box { fill: #C99A62; }
.box2 { fill: #A97C47; }
.sl { fill: #4C6378; }
.sla { fill: none; stroke: #4C6378; stroke-linecap: round; }
.ink { fill: #121719; }
.mono { font-family: "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, Menlo, monospace; font-weight: 600; }
@media (prefers-color-scheme: dark) {
  .bd { fill: #161B1E; }
  .pp { fill: #252D32; stroke: #3E4A50; }
  .pf { fill: #252D32; }
  .pl { stroke: #4E5B62; }
  .dk { fill: #343E44; }
  .dk2 { fill: #232A2E; }
  .gr { fill: #56646C; }
  .grs { stroke: #8C99A0; }
  .scr { fill: #0B0F11; }
  .mu { fill: #7D8A91; }
  .mus { stroke: #7D8A91; }
  .ok { fill: #5BD0A0; }
  .oks { fill: #13342A; }
  .okl { stroke: #5BD0A0; }
  .ck { stroke: #062118; }
  .no { fill: #FF8A7A; }
  .nos { fill: #3D1C18; }
  .sl { fill: #8EA3B8; }
  .sla { stroke: #8EA3B8; }
  .ink { fill: #E8EDEF; }
}
.ac { fill: #0B6A4C; }
.acs { fill: none; stroke: #0B6A4C; stroke-linecap: round; stroke-linejoin: round; }
.ar { fill: none; stroke: #0B6A4C; stroke-width: 15; stroke-linecap: round; stroke-linejoin: round; }
.ha { fill: #E2F1EA; }
@media (prefers-color-scheme: dark) { .ac { fill: #5BD0A0; } .acs, .ar { stroke: #5BD0A0; } .ha { fill: #13342A; } }
</style>

