<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="repos-title repos-desc">
<title id="repos-title">The three repositories and how they depend on each other</title>
<desc id="repos-desc">software-factory holds the engineering path, idea to shipped change, for developers using a coding agent. Its base plugin sf-core depends on skills-core and installs it with it. Four optional plugins sit beside sf-core: sf-reviewers, sf-security, sf-security-deep and sf-ops. agent-factory holds company work for founders and small teams: af-core with the company.md template, and one specialist for each department: support, sales, finance, legal, HR, operations, data, design, product, marketing, CEO advisor and small business. It builds on the skills repository. There is no link between software-factory and agent-factory; engineering work goes to software-factory. The skills repository, with skills-core for thinking, writing and research, is for everyone.</desc>
<style>
:root { color-scheme: light dark; }
text { font-family: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif; fill: #121719; font-size: 15px; }
.mono { font-family: "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, Menlo, monospace; }
.b { font-weight: 650; }
.muted { fill: #4A555B; }
.sm { font-size: 13px; }
.xs { font-size: 12px; }
.h { font-size: 20px; }
.ink { fill: #121719; }
.block { fill: #F3F5F6; stroke: #77838A; stroke-width: 1.5; }
.box { fill: #FFFFFF; stroke: #77838A; stroke-width: 1.5; }
.opt { fill: #FFFFFF; stroke: #77838A; stroke-width: 1.5; stroke-dasharray: 5 4; }
.key { fill: #E2F1EA; stroke: #0B6A4C; stroke-width: 2; }
.gate { fill: #FBEFD9; stroke: #8A5300; stroke-width: 2; }
.gatei { fill: none; stroke: #8A5300; stroke-width: 2.5; stroke-linecap: round; }
.warn { fill: #8A5300; }
.acc { fill: #0B6A4C; }
.line { fill: none; stroke: #77838A; stroke-width: 1.75; }
.dash { fill: none; stroke: #77838A; stroke-width: 1.75; stroke-dasharray: 6 5; }
.aline { fill: none; stroke: #0B6A4C; stroke-width: 2.25; }
.head { fill: #77838A; }
.ahead { fill: #0B6A4C; }
.red { fill: #B42318; }
.green { fill: #0B6A4C; }
.icon { fill: #FFFFFF; stroke: #4A555B; stroke-width: 1.5; stroke-linejoin: round; }
.iconl { fill: none; stroke: #4A555B; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
@media (prefers-color-scheme: dark) {
  text, .ink { fill: #E8EDEF; }
  .muted { fill: #A9B4BA; }
  .block { fill: #161B1E; stroke: #7D8A91; }
  .box, .opt { fill: #0E1214; stroke: #7D8A91; }
  .key { fill: #13342A; stroke: #5BD0A0; }
  .gate { fill: #3A2C12; stroke: #F2B755; }
  .gatei { stroke: #F2B755; }
  .warn { fill: #F2B755; }
  .acc, .green { fill: #5BD0A0; }
  .red { fill: #FF8A7A; }
  .line, .dash { stroke: #7D8A91; }
  .head { fill: #7D8A91; }
  .aline { stroke: #5BD0A0; }
  .ahead { fill: #5BD0A0; }
  .icon { fill: #0E1214; stroke: #A9B4BA; }
  .iconl { stroke: #A9B4BA; }
}
</style>
<defs>
<marker id="r-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="ahead" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="r-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
