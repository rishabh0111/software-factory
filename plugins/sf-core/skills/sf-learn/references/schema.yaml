# Frontmatter schema for lessons written by /sf-learn capture.
# The canonical frontmatter contract for every lesson in the lessons folder.
# lesson-format.md holds the prose rules (corpus-first vocabulary, category
# mapping, YAML safety) and the body templates.
#
# The schema has two tracks based on problem_type:
#   Bug track  — problem_type is a defect or failure (build_error, test_failure, etc.)
#   Knowledge track — problem_type is guidance or practice (best_practice, workflow_issue, etc.)
#
# Both tracks share the same required core fields. The tracks differ in which
# additional fields are required vs optional (see track_rules below).

# Bump only when the file's shape changes, not when values are added.
schema_version: 2

# --- Track classification ---------------------------------------------------
tracks:
  bug:
    description: "Defects, failures, and errors that were diagnosed and fixed"
    problem_types:
      - build_error
      - test_failure
      - runtime_error
      - performance_issue
      - database_issue
      - security_issue
      - ui_bug
      - integration_issue
      - logic_error
  knowledge:
    description: "Practices, patterns, conventions, decisions, workflow improvements, and documentation"
    problem_types:
      - best_practice
      - documentation_gap
      - workflow_issue
      - developer_experience
      - architecture_pattern
      - design_pattern
      - tooling_decision
      - convention

# --- Fields required by BOTH tracks -----------------------------------------
required_fields:
  title:
    type: string
    description: "The problem (bug track) or the guidance (knowledge track) in one line, worded as a later search for it would be. sf-plan and sf-debug match on it."

  category:
    type: string
    description: "The lessons-folder subdirectory the lesson lives in (the corpus directory for this area, else the category mapping in lesson-format.md)"

  tags:
    type: array[string]
    min_items: 1
    max_items: 8
    description: "Search keywords, lowercase and hyphen-separated: the module, technology, error and concept words a later lookup would use"

  module:
    type: string
    description: "Module or area affected"

  date:
    type: string
    pattern: '^\d{4}-\d{2}-\d{2}$'
    description: "Date documented (YYYY-MM-DD)"

  problem_type:
    type: enum
    values:
      - build_error
      - test_failure
      - runtime_error
      - performance_issue
      - database_issue
      - security_issue
      - ui_bug
      - integration_issue
      - logic_error
      - developer_experience
      - workflow_issue
      - best_practice
      - documentation_gap
      - architecture_pattern
      - design_pattern
      - tooling_decision
      - convention
    description: "Primary category — determines track (bug vs knowledge). Prefer the narrowest applicable value; best_practice is the fallback when no narrower knowledge-track value fits."

  component:
    type: string
    suggested_values:
      - data_model
      - api_layer
      - service_layer
      - background_job
      - database
      - frontend
      - messaging
      - infrastructure
      - observability
      - authentication
      - payments
      - development_workflow
      - testing_framework
      - documentation
      - tooling
    description: "Component or area involved. Open vocabulary: choose it per the corpus-first rule in lesson-format.md (corpus value for this area, most-used spelling when the corpus disagrees, suggested_values only when no doc covers the area; corpus values reused as spelled). A newly chosen suggested_values fallback is lowercase, underscore-separated."

  severity:
    type: enum
    values:
      - critical
      - high
      - medium
      - low
    description: "Impact severity"

# --- Track-specific rules ----------------------------------------------------
track_rules:
  bug:
    required:
      symptoms:
        type: array[string]
        min_items: 1
        max_items: 5
        description: "Observable symptoms such as errors or broken behavior"
      root_cause:
        type: string
        suggested_values:
          - wrong_api
          - data_integrity
          - concurrency
          - async_timing
          - memory_leak
          - config_error
          - logic_error
          - test_isolation
          - missing_validation
          - missing_permission
          - missing_workflow_step
          - inadequate_documentation
          - missing_tooling
          - incomplete_setup
        description: "Fundamental technical cause of the problem. Open vocabulary, corpus-first rule as for component, matched by the cause itself rather than the area."
      resolution_type:
        type: enum
        values:
          - code_fix
          - migration
          - config_change
          - test_fix
          - dependency_update
          - environment_setup
          - workflow_improvement
          - documentation_update
          - tooling_addition
          - seed_data_update
        description: "Type of fix applied"

  knowledge:
    optional:
      applies_when:
        type: array[string]
        max_items: 5
        description: "Conditions or situations where this guidance applies"
      symptoms:
        type: array[string]
        max_items: 5
        description: "Observable gaps or friction that prompted this guidance (optional for knowledge track)"
      root_cause:
        type: string
        suggested_values:
          - wrong_api
          - data_integrity
          - concurrency
          - async_timing
          - memory_leak
          - config_error
          - logic_error
          - test_isolation
          - missing_validation
          - missing_permission
          - missing_workflow_step
          - inadequate_documentation
          - missing_tooling
          - incomplete_setup
        description: "Underlying cause, if there is a specific one (optional for knowledge track). Open vocabulary, corpus-first rule as for component, matched by the cause itself rather than the area."
      resolution_type:
        type: enum
        values:
          - code_fix
          - migration
          - config_change
          - test_fix
          - dependency_update
          - environment_setup
          - workflow_improvement
          - documentation_update
          - tooling_addition
          - seed_data_update
        description: "Type of change, if applicable (optional for knowledge track)"

# --- Fields optional for BOTH tracks ----------------------------------------
optional_fields:
  related_components:
    type: array[string]
    description: "Other components involved"

  last_updated:
    type: string
    pattern: '^\d{4}-\d{2}-\d{2}$'
    description: "Date of the last substantive update (YYYY-MM-DD), added when capture updates an existing lesson"

  status:
    type: enum
    values:
      - stale
    description: "Set by refresh when a lesson is in doubt and no trustworthy action is possible; stale_reason and stale_date go with it"

  stale_reason:
    type: string
    description: "What refresh found that put the lesson in doubt"

  stale_date:
    type: string
    pattern: '^\d{4}-\d{2}-\d{2}$'
    description: "Date refresh marked the lesson stale (YYYY-MM-DD)"

  supersedes:
    type: array[string]
    description: "Filenames of lessons this one replaced (optional; git history carries the same record)"

  retire_when:
    type: string
    description: "The change outside the repo that would retire this lesson, and how a refresh can check for it without changing the repo, e.g. \"example-org/sdk#1234 closed as fixed in a released sdk version; check the issue and the sdk release notes\". Set it only when the guidance holds just while something outside the repo holds: an open upstream bug, a tool or platform version, a dependency's behavior. Omit it otherwise. A verification that needs a repo change, such as removing a workaround and rerunning CI, belongs in the body as the step before removal."

# --- Fields optional for bug track only -------------------------------------
bug_optional_fields:
  framework_version:
    type: string
    description: "Framework or runtime name and version the bug was observed on, e.g. \"rails 7.1.2\" or \"node 22.4.0\". Only relevant for bug-track docs."

# --- Older lessons ------------------------------------------------------------
# Older lessons in a repo may predate parts of this contract. They stay valid:
#   - Bug-track fields on a knowledge-track lesson are harmless. Refresh leaves
#     them unless it rewrites the lesson for another reason.
#   - component/root_cause values from an earlier closed list (rails_*,
#     hotwire_turbo, missing_include, ...) or a rails_version field stay; the
#     corpus-first rule keeps a repo that uses them consistent.
#   - A lesson without title, category or tags stays valid; refresh adds them
#     when it updates the lesson for another reason.
# New lessons follow every rule above.

# --- Validation rules --------------------------------------------------------
validation_rules:
  - "Determine track from problem_type using the tracks section above"
  - "All shared required_fields (title, category, tags, module, date, problem_type, component, severity) must be present on new lessons"
  - "Bug-track required fields (symptoms, root_cause, resolution_type) must be present on bug-track docs"
  - "Knowledge-track docs have no additional required fields beyond the shared ones"
  - "Bug-track fields on existing knowledge-track lessons are harmless (see the older-lessons note)"
  - "Track-specific optional fields may be included but are not required"
  - "Enum fields (problem_type, severity, resolution_type) must match allowed values exactly"
  - "Open-vocabulary fields (component, root_cause) follow the corpus-first rule in lesson-format.md: component is matched by area (the value existing lessons in the lessons folder use for that area, most-used spelling when existing docs disagree), root_cause is matched by the cause itself (the value existing docs use for that same cause, most-used spelling when existing docs disagree), suggested_values only when no existing doc covers the area (component) or names the cause (root_cause). Do not coin a near-synonym of a value the corpus already uses"
  - "Array fields must respect min_items/max_items when specified"
  - "date must match YYYY-MM-DD format"
  - "framework_version, if provided, only applies to bug-track docs"
  - "retire_when is optional on both tracks; when present it is one string, and a doc without it stays valid"
  - "tags should be lowercase and hyphen-separated"
  - "Array-of-strings frontmatter items (symptoms, applies_when, tags, related_components, or any future array field) must be wrapped in double quotes when the value starts with a YAML reserved indicator (`, [, *, &, !, |, >, %, @, ?) or contains the substring `: ` — otherwise strict YAML parsers reject the file"
